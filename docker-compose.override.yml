services:
  web:
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=true

  scheduler:
    volumes:
      - .:/app

  kibana:
    ports:
      - "5601:5601"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  postgres:
    ports:
      - "5432:5432"
