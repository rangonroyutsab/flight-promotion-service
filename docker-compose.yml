services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  web:
    build:
      context: .
    image: flight_promotion_service:latest
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file: .env
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build:
      context: .
    image: flight_promotion_service:latest
    command: ["python", "manage.py", "migrate"]
    env_file: .env
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
    image: flight_promotion_service:latest
    command: ["/app/docker/scheduler/entrypoint.sh"]
    env_file: .env
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - backend_network
      - frontend_network
    profiles:
      - tools
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  sample-data-init:
    image: curlimages/curl:latest
    volumes:
      - ./docker/kibana-init:/scripts
    command: ["sh", "/scripts/install-sample-data.sh"]
    networks:
      - backend_network
    profiles:
      - init
    depends_on:
      kibana:
        condition: service_healthy

  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-33Z
    volumes:
      - ./docker/minio-init:/scripts
    command: ["sh", "/scripts/create-bucket.sh"]
    env_file: .env
    networks:
      - backend_network
    profiles:
      - init
    depends_on:
      minio:
        condition: service_healthy

networks:
  backend_network:
    name: flight_backend
  frontend_network:
    name: flight_frontend

volumes:
  postgres_data:
  es_data:
  minio_data:
